<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Tasks</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/dist/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .glass-card {
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .locked {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(1);
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen">

    <header class="p-6 flex justify-between items-center border-b border-zinc-800">
        <h1 class="text-xl font-bold text-yellow-400">Daily Tasks</h1>
        <div class="text-right">
            <p class="text-xs text-gray-400">Balance</p>
            <p class="text-lg font-bold text-green-400">₹<span id="walletBal">0</span></p>
        </div>
    </header>

    <div class="p-6 space-y-4">
        <div id="task1" class="glass-card p-5 rounded-2xl flex justify-between items-center">
            <div>
                <h3 class="font-bold text-sm">Watch Video Ad</h3>
                <p class="text-xs text-green-400">+ ₹100.00</p>
            </div>
            <button onclick="completeTask(1, 100)" class="bg-yellow-500 text-black px-5 py-2 rounded-xl text-xs font-bold shadow-lg active:scale-95">Claim</button>
        </div>

        <div id="task2" class="glass-card p-5 rounded-2xl flex justify-between items-center">
            <div>
                <h3 class="font-bold text-sm">Social Share</h3>
                <p class="text-xs text-green-400">+ ₹100.00</p>
            </div>
            <button onclick="completeTask(2, 100)" class="bg-yellow-500 text-black px-5 py-2 rounded-xl text-xs font-bold shadow-lg active:scale-95">Claim</button>
        </div>

        <div id="task3" class="glass-card p-5 rounded-2xl flex justify-between items-center">
            <div>
                <h3 class="font-bold text-sm">Daily Check-in</h3>
                <p class="text-xs text-green-400">+ ₹100.00</p>
            </div>
            <button onclick="completeTask(3, 100)" class="bg-yellow-500 text-black px-5 py-2 rounded-xl text-xs font-bold shadow-lg active:scale-95">Claim</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://qqasotinjmdknzifbrew.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxYXNvdGluam1ka256aWZicmV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTg4NzQsImV4cCI6MjA5Mjg5NDg3NH0.MdgrkZU48ARO8LqzWZaCKOUOMxhDVvMdaZHY2fjmOSM";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        const phone = localStorage.getItem('user_phone');

        // 1. ਸਭ ਤੋਂ ਪਹਿਲਾਂ ਡਾਟਾ ਲੋਡ ਕਰੋ
        async function loadData() {
            if (!phone) { window.location.href = "index.html"; return; }

            // ਬੈਲੇਂਸ ਚੈੱਕ ਕਰੋ
            let { data: profile } = await supabaseClient.from('profiles').select('balance').eq('phone', phone).single();
            if (profile) {
                document.getElementById('walletBal').innerText = profile.balance;
            }

            // ਲਾਕ ਚੈੱਕ ਕਰੋ
            checkTaskLocks();
        }

        // 2. ਟਾਸਕ ਲਾਕ ਸਿਸਟਮ (ਰਾਤ 12 ਵਜੇ ਰੀਸੈੱਟ)
        function checkTaskLocks() {
            const lastDate = localStorage.getItem('last_task_date');
            const today = new Date().toDateString();

            // ਜੇ ਨਵਾਂ ਦਿਨ ਹੈ, ਤਾਂ ਲਾਕ ਖੋਲ੍ਹ ਦਿਓ
            if (lastDate !== today) {
                localStorage.removeItem('completed_tasks');
                localStorage.setItem('last_task_date', today);
            }

            const completed = JSON.parse(localStorage.getItem('completed_tasks') || "[]");
            completed.forEach(id => {
                const taskDiv = document.getElementById('task' + id);
                if (taskDiv) {
                    taskDiv.classList.add('locked');
                    taskDiv.querySelector('button').innerText = "Locked";
                }
            });
        }

        // 3. ਟਾਸਕ ਪੂਰਾ ਕਰਨ ਦਾ ਫੰਕਸ਼ਨ
        async function completeTask(id, amount) {
            try {
                // ਪੁਰਾਣਾ ਬੈਲੇਂਸ ਲਵੋ
                let { data: profile } = await supabaseClient.from('profiles').select('balance').eq('phone', phone).single();
                const newTotal = (profile.balance || 0) + amount;

                // ਸੁਪਾਬੇਸ ਅਪਡੇਟ
                const { error } = await supabaseClient.from('profiles').update({ balance: newTotal }).eq('phone', phone);

                if (!error) {
                    // ਲਾਕ ਸੇਵ ਕਰੋ
                    let completed = JSON.parse(localStorage.getItem('completed_tasks') || "[]");
                    completed.push(id);
                    localStorage.setItem('completed_tasks', JSON.stringify(completed));

                    alert("Success! ₹" + amount + " added to your wallet.");
                    location.reload();
                } else {
                    alert("Error updating wallet.");
                }
            } catch (err) {
                console.error(err);
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
