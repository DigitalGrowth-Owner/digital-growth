<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refer & Earn</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a0a0a] text-center">
    <header class="p-4 border-b border-white/5 text-left">
        <button onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left text-white"></i></button>
    </header>
    
    <div class="p-10">
        <div class="w-24 h-24 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-gift text-4xl text-green-500"></i>
        </div>
        <h2 class="text-3xl font-bold text-yellow-500 mb-2">Refer & Earn ₹300</h2>
        <p class="text-gray-400 text-sm mb-8">Share your link below. You get ₹300 for every new user who registers.</p>

        <div class="glass-card p-6 border-dashed border-2 border-yellow-500/30">
            <p id="refLink" class="text-yellow-500 font-mono text-sm mb-4">https://digitalgrowth.pages.dev/index.html?ref=User786</p>
            <button onclick="copyLink()" class="btn-main gold-gradient text-black font-bold py-3 rounded-xl w-full shadow-md">
                <i class="fas fa-copy mr-2"></i> Copy Referral Link
            </button>
        </div>
    </div>

    <script>
        function copyLink() {
            const link = document.getElementById('refLink').innerText;
            navigator.clipboard.writeText(link).then(() => {
                alert("Referral link copied to clipboard!");
            });
        }
    </script>
</body>
</html>
