<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw Funds | Digital Growth</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a0a0a] min-h-screen text-white" onload="initWithdraw()">

    <header class="p-4 flex items-center border-b border-white/5 bg-black">
        <button onclick="window.location.href='dashboard.html'" class="mr-4 text-gray-400">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="font-bold text-lg text-yellow-500">Withdrawal</span>
    </header>

    <div class="p-6">
        <div id="lockSection" class="hidden glass-card p-8 text-center space-y-4 border-yellow-500/30">
            <div class="w-20 h-20 mx-auto rounded-full bg-yellow-500/10 flex items-center justify-center">
                <i class="fas fa-lock text-3xl text-yellow-500"></i>
            </div>
            <h2 class="text-xl font-bold text-yellow-500">Feature Locked!</h2>
            <p class="text-gray-400 text-sm">Purchase the <span class="text-yellow-500 font-bold">Golden Package (₹99)</span> to unlock withdrawals.</p>
            <button onclick="window.location.href='payment.html'" class="btn-main gold-gradient text-black font-bold py-3 rounded-xl mt-4 w-full">
                Activate Now
            </button>
        </div>

        <div id="withdrawSection" class="hidden space-y-6">
            <div class="glass-card p-6 bg-gradient-to-br from-zinc-900 to-black">
                <p class="text-gray-400 text-xs mb-1 uppercase tracking-wider">Available Balance</p>
                <h2 class="text-4xl font-bold text-yellow-500">₹<span id="currentBalDisplay">0</span></h2>
                <p class="text-[10px] text-gray-500 mt-2">* Minimum withdrawal amount is ₹3,000</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 ml-1">Withdrawal Amount</label>
                    <input type="number" id="withdrawAmt" placeholder="Enter Amount (Min. 3000)" class="input-box w-full p-4 rounded-xl bg-zinc-900 border border-white/10 outline-none focus:border-yellow-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 ml-1">UPI ID / Account Details</label>
                    <input type="text" id="upiId" placeholder="example@upi" class="input-box w-full p-4 rounded-xl bg-zinc-900 border border-white/10 outline-none focus:border-yellow-500">
                </div>
                
                <button onclick="processWithdrawal()" class="btn-main gold-gradient text-black font-bold w-full py-4 rounded-xl shadow-lg active:scale-95 transition-transform">
                    Submit Request
                </button>
            </div>
        </div>
    </div>

    <script>
        const MINIMUM_WITHDRAWAL = 3000;

        function initWithdraw() {
            // Check Activation Status (Simulated)
            const isActivated = localStorage.getItem('isPremiumUser') === 'true';
            const balance = parseInt(localStorage.getItem('walletBal') || 0);

            if (!isActivated) {
                document.getElementById('lockSection').classList.remove('hidden');
            } else {
                document.getElementById('withdrawSection').classList.remove('hidden');
                document.getElementById('currentBalDisplay').innerText = balance;
            }
        }

        function processWithdrawal() {
            const amount = parseInt(document.getElementById('withdrawAmt').value);
            const upi = document.getElementById('upiId').value;
            const currentBal = parseInt(localStorage.getItem('walletBal') || 0);

            if (isNaN(amount) || amount < MINIMUM_WITHDRAWAL) {
                alert("Error: Minimum withdrawal amount is ₹" + MINIMUM_WITHDRAWAL);
                return;
            }

            if (amount > currentBal) {
                alert("Error: Insufficient balance!");
                return;
            }

            if (upi.trim() === "") {
                alert("Error: Please enter your UPI ID or Payment Details.");
                return;
            }

            // Deduct balance and show success
            const newBal = currentBal - amount;
            localStorage.setItem('walletBal', newBal);
            alert("Success! Your withdrawal request of ₹" + amount + " has been submitted. It will be credited within 24-48 hours.");
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
