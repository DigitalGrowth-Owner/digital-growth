<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Growth | Authentication</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center min-h-screen px-6">

    <div class="w-full max-w-sm text-center">
        <div class="w-20 h-20 mx-auto mb-6 rounded-2xl gold-gradient flex items-center justify-center shadow-lg">
            <i class="fas fa-chart-line text-3xl text-black"></i>
        </div>
        <h1 class="text-3xl font-bold mb-2 text-white">Digital Growth</h1>
        <p class="text-gray-500 text-sm mb-8">Enter your credentials to continue</p>

        <div class="glass-card p-6">
            <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/50 text-red-500 text-xs py-3 rounded-xl mb-4">
                <i class="fas fa-exclamation-circle mr-1"></i> <span id="errorMsg"></span>
            </div>

            <input type="tel" id="phone" maxlength="10" placeholder="Mobile Number" class="input-box w-full p-4 rounded-xl mb-4 bg-zinc-900 text-white border border-yellow-500/20 outline-none focus:border-yellow-500">
            
            <input type="password" id="pass" placeholder="Password" class="input-box w-full p-4 rounded-xl mb-6 bg-zinc-900 text-white border border-yellow-500/20 outline-none focus:border-yellow-500">
            
            <button onclick="validateAndLogin()" class="btn-main gold-gradient text-black font-bold w-full py-4 rounded-xl shadow-lg active:scale-95 transition-transform">
                Login / Register
            </button>
        </div>
    </div>

    <script>
    const SB_URL = "https://qqasotinjmdknzifbrew.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFxYXNvdGluam1ka256aWZicmV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTg4NzQsImV4cCI6MjA5Mjg5NDg3NH0.MdgrkZU48ARO8LqzWZaCKOUOMxhDVvMdaZHY2fjmOSM";
const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

async function validateAndLogin() {
    const phone = document.getElementById('phone').value;
    const pass = document.getElementById('pass').value;

    if (phone.length < 10 || pass === "") {
        alert("Please enter valid details.");
        return;
    }

    let { data: profile } = await supabaseClient.from('profiles').select('*').eq('phone', phone).single();

    if (profile) {
        if (profile.password === pass) {
            localStorage.setItem('user_phone', phone);
            window.location.href = "dashboard.html";
        } else {
            alert("Incorrect password!");
        }
    } else {
        await supabaseClient.from('profiles').insert([{ phone: phone, password: pass, balance: 0, is_premium: false }]);
        localStorage.setItem('user_phone', phone);
        window.location.href = "dashboard.html";
    }
}

</script>

</body>
</html>
